<style>
  :root {
    color-scheme: light dark;

    --code-bg: rgba(127,127,127,.14); --accent: #E85900;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e6e6; --bg: #161616; --muted: #999999; }
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.75; max-width: 52rem; margin: 0 auto; padding: 1.2rem 16px 4rem;
    color: var(--fg); background: var(--bg); overflow-wrap: anywhere;
  }
  a { color: var(--accent); }
  nav { font-size: .9rem; color: var(--muted); margin-bottom: 1.5rem; }
  h1 { font-size: 1.7rem; line-height: 1.4; }
  h2 { margin-top: 2.4rem; padding-bottom: .3rem; border-bottom: 1px solid var(--line); }
  h3 { margin-top: 1.8rem; }
  code { background: var(--code-bg); padding: .1rem .35rem; border-radius: .25rem; font-size: .9em; }
  pre { background: var(--code-bg); padding: .9rem 1rem; border-radius: .4rem; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1rem 0; }
  th, td { text-align: left; padding: .45rem .7rem; border: 1px solid var(--line); vertical-align: top; }
  th { background: var(--code-bg); }
  blockquote { margin: 1rem 0; padding: .2rem 1rem; border-left: 4px solid var(--line); color: var(--muted); }
  img { max-width: 100%; }
  footer { margin-top: 3rem; font-size: .85rem; color: var(--muted); }
</style>
