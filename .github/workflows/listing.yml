name: Publish listing

# Release が作られると index.json を組み立て直して Pages へ公開する。
# Release はソースリポジトリ (非公開) の CI が PAT で作成するため、
# このイベントが発火する（GITHUB_TOKEN 由来の操作では発火しない）。
on:
  release:
    types: [published, edited, deleted, released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages のデプロイが競合しないようにする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: リスティング公開
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 案内ページを配置
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: index.json を生成
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/make_listing.py --repo "${GITHUB_REPOSITORY}" --output _site/index.json

      - name: 生成結果を確認
        run: |
          python3 -c "
          import json,sys
          d=json.load(open('_site/index.json'))
          n=sum(len(p['versions']) for p in d['packages'].values())
          print(f\"{len(d['packages'])} パッケージ / {n} バージョン\")
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
